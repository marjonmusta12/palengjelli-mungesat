views.ann=()=>`<h1>Njoftime dhe aktivitete</h1><div class="card"><input id="nt" placeholder="Titulli" style="width:100%"><br><textarea id="nx" rows="3" placeholder="Përmbajtja" style="width:100%"></textarea><select id="nc"><option>Njoftim</option><option>Aktivitet</option></select> <label style="display:inline"><input type="checkbox" id="np"> Publik</label> <button onclick="addAnn()">Publiko</button></div><br>${db.ann.length?db.ann.map((a,i)=>`<div class="card" style="margin:6px 0"><b>${esc(a.t)}</b> · ${a.cat||'Njoftim'} · ${a.d} · ${a.pub?'Publik':'Privat'}<p>${esc(a.x)}</p><button class="r" onclick="if(confirm('Fshi?')){db.ann.splice(${i},1);save();route()}">Fshi</button></div>`).join(''):empty('','Nuk ka njoftime.','Krijoni të parin.')}`;

views.docs=()=>`<h1>Dokumente</h1><div class="card"><input id="dn" placeholder="Emri i dokumentit"> <input id="dd" placeholder="Përshkrimi"> <input type="file" id="df"> <label style="display:inline"><input type="checkbox" id="dp"> Publik</label> <button onclick="addDoc()">Ngarko</button><p class="note">Maksimumi 700 KB për skedar (ruhet në shfletues).</p></div><br>${db.docs.length?`<table><tr><th>Emri</th><th>Data</th><th>Qasja</th><th></th></tr>${db.docs.map((d,i)=>`<tr><td class="l">${esc(d.n)}</td><td>${d.d}</td><td>${d.pub?'Publik':'Privat'}</td><td><a class="btn" href="${d.data}" download="${esc(d.name)}">Shkarko</a> <button class="r" onclick="if(confirm('Fshi?')){db.docs.splice(${i},1);save();route()}">Fshi</button></td></tr>`).join('')}</table>`:empty('','Nuk ka ende dokumente.','Ngarkoni dokumentin e parë.')}`;
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
function addDoc(){const f=df.files[0];if(!f||!dn.value.trim())return alert('Zgjidhni skedarin dhe emrin.');if(f.size>7e5)return alert('Skedari është shumë i madh.');rd(f,d=>{db.docs.push({n:dn.value,desc:dd.value,pub:dp.checked,data:d,name:f.name,d:today(),by:S.name});lg('Ngarkoi dokument '+dn.value);route()})}
views.gal=()=>`<h1>Galeria</h1><div class="card"><input id="gn" placeholder="Titulli"> <input type="file" id="gf" accept="image/*"> <label style="display:inline"><input type="checkbox" id="gp"> Publik</label> <button onclick="addGal()">Ngarko foto</button></div><br>${db.gal.length?`<div class="grid">${db.gal.map((g,i)=>`<div class="card"><img class="gi" src="${g.data}"><b>${esc(g.n)}</b> · ${g.pub?'Publik':'Privat'}<br><button class="r" onclick="if(confirm('Fshi?')){db.gal.splice(${i},1);save();route()}">Fshi</button></div>`).join('')}</div>`:empty('','Galeria është bosh.','Ngarkoni fotografinë e parë.')}`;
function rsz(f,m,cb){rd(f,u=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.src=u})}
function addGal(){const f=gf.files[0];if(!f||!gn.value.trim())return alert('Zgjidhni foton dhe titullin.');rsz(f,900,d=>{db.gal.push({n:gn.value,pub:gp.checked,data:d,d:today()});lg('Ngarkoi foto '+gn.value);route()})}

 if(b.ty=='ti')return `<div class="blk tix ${b.al=='l'?'rev':''}"><div>${h}${t}</div><div>${im}</div></div>`;
 if(b.ty=='btn')return `<div class="blk"><a class="btn" href="${safeH(b.href)}">${esc(b.lb||'Lexo më shumë')}</a></div>`;return ''};
let curKey='home',edKey='home';
const fab=()=>S&&S.role=='admin'?`<button class="edfab noprint" onclick="edGo('${curKey}')">Modifiko këtë faqe</button>`:'';
function edGo(k){edKey=k;tab='ed';location.hash='/portal/admin'}
page=(t,s,b)=>{const k=curKey,o=K.pages[k]||{},B=(o.blocks||[]).map(blk).join(''),pre=o.pos=='before'?B:'',post=o.pos=='before'?'':B;
 return nav()+`<div class="band" ${o.img?`style="background-image:linear-gradient(90deg,color-mix(in srgb,var(--nav) 92%,transparent),color-mix(in srgb,var(--nav) 55%,transparent)),url('${o.img}');background-size:cover;background-position:center"`:''}><div class="w"><div class="bc"><a href="#/">Kryesore</a> / ${esc(o.t||t)}</div><h1>${esc(o.t||t)}</h1><div>${esc(o.s||s||'')}</div></div></div><div class="wrap">${pre}${o.hide?'':b}${post}</div>`+foot()+fab()};
function home(){curKey='home';const h=home0(),f=foot(),B=(K.pages.home&&K.pages.home.blocks||[]).map(blk).join('');return h.slice(0,h.length-f.length)+(B?`<div class="sc"><div class="w">${B}</div></div>`:'')+f+fab()}
const cus=k=>K.custom.find(c=>c.k==k&&c.on!==false);
function route(){applyTheme();const h=location.hash.slice(1)||'/';const v=document.getElementById('v');scrollTo(0,0);
 if(h=='/portal'){if(S)return location.hash=S.role=='admin'?'/portal/admin':'/portal/klasa/'+S.cls;return v.innerHTML=login()}
 if(h.startsWith('/portal/')){if(!S)return location.hash='/portal';
  if(h=='/portal/admin'){if(S.role!='admin')return location.hash='/portal'}
  else{const id=h.split('/')[3];if(!cl(id)||(S.role!='admin'&&!(S.classes||[S.cls]).includes(id)))return location.hash='/portal';cls=id;if(S.role!='admin')S.cls=id}
  v.innerHTML=panel();if(document.getElementById('hh'))hUI();return}
 const k=h.replace('/','');curKey=k||'home';
 if(Object.prototype.hasOwnProperty.call(PG,k))v.innerHTML=PG[k]();else if(cus(k))v.innerHTML=page(cus(k).t,'','');else{curKey='home';v.innerHTML=home()}}
const PGL=[['home','Faqja kryesore'],['rreth','Rreth platformës'],['klasat','Klasat'],['njoftime','Njoftime'],['dokumente','Dokumente publike'],['galeria','Galeria'],['aktivitetet','Aktivitetet'],['udhezuesi','Udhëzuesi'],['kontakti','Kontakti'],['stafi','Stafi akademik'],['kalendari','Kalendari shkollor']];
const allP=()=>PGL.concat(K.custom.map(c=>[c.k,c.t+' (e re)']));
const fi=(h,f)=>`<input type="file" accept="image/*" onchange="${f}">`;
const inp=(v,f,ph)=>`<input value="${esc(v)}" placeholder="${esc(ph||'')}" onchange="${f}">`;
views.ed=()=>{const k=edKey,o=pg(k),cu=K.custom.find(c=>c.k==k),def=(allP().find(x=>x[0]==k)||['',''])[1];
 let r=`<h1>Editori i faqeve</h1><div style="display:flex;gap:16px;flex-wrap:wrap"><div class="card" style="flex:0 0 230px"><b>Faqet</b>${allP().map(p=>`<button class="${p[0]==k?'':'s'}" style="display:block;width:100%;margin:4px 0;text-align:left" onclick="edKey='${p[0]}';route()">${esc(p[1])}</button>`).join('')}<hr><button class="g" style="width:100%" onclick="newPage()">+ Faqe e re</button></div><div style="flex:1;min-width:280px">`;
 if(k=='home'){const h=hc();r+=`<div class="card"><h3>Slider-i i faqes kryesore</h3>${h.sl.map((x,i)=>`<div class="bk"><b>Slide ${i+1}</b>${inp(x[0],`hmS(${i},0,this.value)`,'Titulli')}<textarea rows="2" onchange="hmS(${i},1,this.value)">${esc(x[1])}</textarea>${inp(x[2],`hmS(${i},2,this.value)`,'Teksti i butonit')}${inp(x[3],`hmS(${i},3,this.value)`,'Lidhja (p.sh. #/rreth)')}<label>Foto sfondi</label>${fi('',`hmImg(${i},this)`)} ${x[4]?`<img src="${x[4]}" height="50"> <button class="r" onclick="hmS(${i},4,'');route()">Hiq foton</button>`:''}</div>`).join('')}<h3>Pllakat e shpejta</h3>${h.tl.map((x,i)=>`<div class="bk">${inp(x[0],`hmT(${i},0,this.value)`,'Titulli')}${inp(x[1],`hmT(${i},1,this.value)`,'Nën-teksti')}${inp(x[2],`hmT(${i},2,this.value)`,'Lidhja')}</div>`).join('')}<h3>Motoja</h3>${inp(h.mt,'hc().mt=this.value;save()','Motoja')}</div><br>`}
 else{r+=`<div class="card"><h3>Titulli dhe banneri</h3><label>Titulli</label>${inp(o.t||'',`edF('${k}','t',this.value)`,def)}<label>Nën-titulli</label>${inp(o.s||'',`edF('${k}','s',this.value)`,'Opsionale')}<label>Foto banneri</label>${fi('',`edImg('${k}',this)`)} ${o.img?`<img src="${o.img}" height="50"> <button class="r" onclick="edF('${k}','img','');route()">Hiq</button>`:''}${cu?`<label>Vendosja në menu</label><select onchange="cuF('${k}','menu',this.value)">${MN.map(m=>`<option ${cu.menu==m[0]?'selected':''}>${m[0]}</option>`).join('')}</select><label><input type="checkbox" ${cu.on===false?'':'checked'} onchange="cuF('${k}','on',this.checked)"> Faqja është e publikuar</label>`:`<label><input type="checkbox" ${o.hide?'checked':''} onchange="edF('${k}','hide',this.checked);route()"> Fshih përmbajtjen standarde të faqes</label>`}<label>Blloqet shfaqen</label><select onchange="edF('${k}','pos',this.value)"><option value="after" ${o.pos!='before'?'selected':''}>Pas përmbajtjes standarde</option><option value="before" ${o.pos=='before'?'selected':''}>Para përmbajtjes standarde</option></select></div><br>`}
 r+=`<div class="card"><h3>Blloqet e përmbajtjes</h3>${(o.blocks||[]).map((b,i)=>`<div class="bk"><b>${{text:'Tekst',img:'Foto',ti:'Tekst me foto',btn:'Buton'}[b.ty]}</b> <button class="s" onclick="blkMv('${k}',${i},-1)">Lart</button> <button class="s" onclick="blkMv('${k}',${i},1)">Poshtë</button> <button class="r" onclick="blkDel('${k}',${i})">Fshi</button>${b.ty=='btn'?inp(b.lb,`blkF('${k}',${i},'lb',this.value)`,'Teksti i butonit')+inp(b.href,`blkF('${k}',${i},'href',this.value)`,'Lidhja (#/faqe ose https://...)'):''}${b.ty=='text'||b.ty=='ti'?inp(b.h,`blkF('${k}',${i},'h',this.value)`,'Titulli i seksionit')+`<textarea rows="4" onchange="blkF('${k}',${i},'t',this.value)" placeholder="Teksti">${esc(b.t)}</textarea>`:''}${b.ty=='img'||b.ty=='ti'?`<label>Foto</label>${fi('',`blkImg('${k}',${i},this)`)}${b.img?`<img src="${b.img}" height="60">`:''}`:''}${b.ty=='img'?inp(b.cap,`blkF('${k}',${i},'cap',this.value)`,'Përshkrimi i fotos'):''}${b.ty=='ti'?`<select onchange="blkF('${k}',${i},'al',this.value)"><option value="r" ${b.al!='l'?'selected':''}>Foto djathtas</option><option value="l" ${b.al=='l'?'selected':''}>Foto majtas</option></select>`:''}</div>`).join('')||'<p>Nuk ka blloqe. Shtoni të parin më poshtë.</p>'}<button onclick="addBlk('${k}','text')">+ Tekst</button> <button onclick="addBlk('${k}','img')">+ Foto</button> <button onclick="addBlk('${k}','ti')">+ Tekst me foto</button> <button onclick="addBlk('${k}','btn')">+ Buton</button></div><br><button class="g" onclick="location.hash='/${k=='home'?'':k}'">Shiko faqen</button> ${cu?`<button class="r" onclick="delPage('${k}')">Fshi faqen</button>`:''}</div></div>`;return r};
function edF(k,f,v){pg(k)[f]=v;const c=K.custom.find(x=>x.k==k);if(c&&f=='t'&&v)c.t=v;save()}
function cuF(k,f,v){K.custom.find(c=>c.k==k)[f]=v;save()}
function edImg(k,i){const f=i.files[0];if(f)rsz(f,1400,d=>{pg(k).img=d;save();route()})}
function addBlk(k,ty){const o=pg(k);(o.blocks=o.blocks||[]).push({ty,h:'',t:'',img:'',cap:'',al:'r',lb:'',href:''});save();route()}
function blkF(k,i,f,v){pg(k).blocks[i][f]=v;save()}
function blkMv(k,i,d){const a=pg(k).blocks,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();route()}
function blkDel(k,i){if(confirm('Fshi këtë bllok?')){pg(k).blocks.splice(i,1);save();route()}}
function blkImg(k,i,inp){const f=inp.files[0];if(f)rsz(f,1200,d=>{pg(k).blocks[i].img=d;save();route()})}
function hmS(i,j,v){hc().sl[i][j]=v;save()}function hmT(i,j,v){hc().tl[i][j]=v;save()}
function hmImg(i,inp){const f=inp.files[0];if(f)rsz(f,1600,d=>{hc().sl[i][4]=d;save();route()})}
function newPage(){const t=prompt('Titulli i faqes së re:');if(!t||!t.trim())return;const k='p_'+Date.now().toString(36);K.custom.push({k,t:t.trim(),menu:'Media',on:true});pg(k);edKey=k;lg('Krijoi faqe të re: '+t);route()}
function delPage(k){if(!confirm('Fshi këtë faqe përgjithmonë?'))return;K.custom=K.custom.filter(c=>c.k!=k);delete K.pages[k];edKey='home';lg('Fshiu faqe');save();route()}
views.th=()=>{const t=K.theme,b=K.brand;return `<h1>Pamja dhe ngjyrat</h1><div class="card"><h3>Ngjyrat dhe shkronjat</h3><label>Ngjyra kryesore (menu, banner, tabela)</label><input type="color" value="${t.p}" onchange="thF('p',this.value)"><label>Ngjyra e aksentit</label><input type="color" value="${t.a}" onchange="thF('a',this.value)"><label>Sfondi i faqes</label><input type="color" value="${t.bg}" onchange="thF('bg',this.value)"><label>Shkronjat e titujve</label><select onchange="thF('f',this.value)"><option value="serif" ${t.f!='sans'?'selected':''}>Serif (akademike)</option><option value="sans" ${t.f=='sans'?'selected':''}>Sans-serif (moderne)</option></select><br><br><button class="s" onclick="K.theme={p:'#12306b',a:'#b8963c',bg:'#f4f5f7',f:'serif'};save();route()">Rivendos ngjyrat standarde</button></div><br><div class="card"><h3>Koka e faqes (emri i shkollës)</h3>${inp(b.a,"brF('a',this.value)")}${inp(b.b,"brF('b',this.value)")}${inp(b.c,"brF('c',this.value)")}</div><br><div class="card"><h3>Kopje rezervë</h3><p>Të dhënat ruhen në këtë shfletues. Shkarkoni rregullisht një kopje.</p><button class="g" onclick="exDb()">Shkarko kopjen rezervë</button><br><br><label>Rikthe nga kopja</label><input type="file" accept=".json" onchange="imDb(this)"></div>`};
function thF(f,v){K.theme[f]=v;save();applyTheme()}function brF(f,v){K.brand[f]=v;save()}
function exDb(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='pal-engjelli-kopje-'+today()+'.json';a.click();lg('Shkarkoi kopje rezervë')}
function imDb(i){const f=i.files[0];if(!f||!confirm('Të dhënat aktuale do të zëvendësohen. Vazhdo?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.stu)||!Array.isArray(d.abs))throw 0;localStorage.setItem('pe26',JSON.stringify(d));location.reload()}catch(e){alert('Skedari nuk është kopje e vlefshme.')}};r.readAsText(f)}
route();
</script></body></html>
